version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      # dockertest v3.12.0 imports runc/libcontainer/user, removed in runc v1.4.0
      - dependency-name: github.com/opencontainers/runc
        versions: [">= 1.4.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
